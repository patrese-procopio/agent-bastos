# ==============================================================================
# docker-compose.yml — Agent Bastos
# ==============================================================================
# Stack completa em rede privada isolada (bastos_net):
#
#   api        FastAPI + RAG + ChromaDB        → :8000
#   n8n        Automação HITL / workflows      → :5678
#   evolution  WhatsApp via Baileys            → :8080
#
# Serviços comunicam por NOME de serviço, não por IP ou host.docker.internal.
# Isso funciona igual em Windows, Linux e qualquer CI/CD sem flags extras.
#
# ── Comandos do dia a dia ─────────────────────────────────────────────────────
#   docker compose up -d --build        sobe tudo (reconstruindo a imagem)
#   docker compose up -d api            sobe só a API
#   docker compose up -d n8n evolution  sobe só o stack HITL
#   docker compose logs -f              acompanha todos os logs
#   docker compose logs -f api          logs só da API
#   docker compose ps                   status de cada serviço
#   docker compose down                 para tudo (dados PERSISTEM nos volumes)
#   docker compose down -v              para tudo e APAGA volumes  ⚠️ CUIDADO
#   docker compose exec api bash        terminal dentro do container
# ==============================================================================

services:

  # ────────────────────────────────────────────────────────────────────────────
  # API — FastAPI backend (RAG, autenticação, HITL, OSINT, Grafoscopia...)
  # ────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-bastos:latest
    container_name: agent-bastos-api
    env_file: .env
    ports:
      # BASTOS_BIND_ADDR controla quem enxerga a API:
      #   "127.0.0.1"  -> so loopback (default seguro, dev single-host)
      #   "0.0.0.0"    -> LAN toda (deploy centralizado, sempre com reverse
      #                    proxy HTTPS na frente — nunca sem TLS na rede)
      # Definido no .env do servidor. Default = loopback (comportamento antigo).
      - "${BASTOS_BIND_ADDR:-127.0.0.1}:8000:8000"
    volumes:
      # ── Persistência de dados (volumes nomeados) ───────────────────────────
      - bastos_chroma:/app/data/chroma_db    # base vetorial (963+ chunks)
      - bastos_db:/app/data                  # SQLite: auth, liderancas, grupos
      - bastos_logs:/app/logs                # logs de auditoria (LGPD Art.37)
      # ── Bind mounts de código (desenvolvimento hot-reload) ─────────────────
      # Edite no VS Code → container lê na hora. Não precisa rebuild.
      # Apenas api.py e requirements.txt exigem `docker compose build` ao mudar.
      - ./modules:/app/modules
      - ./routers:/app/routers
      - ./services:/app/services
      - ./config:/app/config
      - ./api.py:/app/api.py
      # ── Credenciais somente-leitura ────────────────────────────────────────
      - ./data/doutrina:/app/data/doutrina:ro
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
    networks:
      - bastos_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    # Healthcheck próprio (definido no Dockerfile via HEALTHCHECK).
    # depends_on n8n não é necessário: API funciona sem o stack HITL.
    # O HITL só é acionado sob demanda (extrato de risco alto), não no boot.

  # ────────────────────────────────────────────────────────────────────────────
  # n8n — Automação HITL e workflows de inteligência
  #
  # Acesse http://localhost:5678 para configurar workflows.
  # Importe os JSONs de n8n_workflows/ na primeira inicialização.
  #
  # Variáveis críticas no .env:
  #   N8N_ENCRYPTION_KEY  — chave para cifrar credenciais salvas no n8n
  #   N8N_WEBHOOK_URL     — URL pública se usar ngrok/túnel (dev local: deixe vazio)
  # ────────────────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: agent-bastos-n8n
    ports:
      # Painel n8n: default loopback (admin acessa da propria maquina do
      # servidor via RDP/VPN). Override BASTOS_N8N_BIND=0.0.0.0 SO se houver
      # reverse proxy TLS na frente + autenticacao adicional.
      - "${BASTOS_N8N_BIND:-127.0.0.1}:5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      # Chave de criptografia das credenciais salvas no n8n.
      # Valor lido do .env — NUNCA hardcode aqui.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # Windows: NTFS não suporta chmod Unix — desativa checagem de permissão
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      # Desativa telemetria e personalização (privacidade operacional)
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Fuso horário do Amazonas
      - GENERIC_TIMEZONE=America/Manaus
      - TZ=America/Manaus
      # URL base para montar os webhook URLs exibidos na UI do n8n.
      # Em dev local: http://localhost:5678/
      # Em produção com domínio: https://n8n.seap.am.gov.br/
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678/}
    volumes:
      # Bind mount na pasta n8n existente — preserva todos os workflows e credenciais
      - C:\Users\Administrador\.n8n:/home/node/.n8n
    networks:
      - bastos_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # ────────────────────────────────────────────────────────────────────────────
  # Evolution API — WhatsApp via Baileys (HITL)
  #
  # Após subir: acesse http://localhost:8080
  # Crie a instância com o nome em EVOLUTION_INSTANCE e escaneie o QR Code.
  # O volume evolution_data persiste a sessão — não precisa novo QR a cada restart.
  # ────────────────────────────────────────────────────────────────────────────
  evolution:
    image: atendai/evolution-api:v1.8.7
    container_name: agent-bastos-evolution
    ports:
      # Evolution API — segue a mesma politica do n8n. Default = loopback.
      - "${BASTOS_EVOLUTION_BIND:-127.0.0.1}:8080:8080"
    environment:
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-bastos_evo_key_TROQUE}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=false
      - DATABASE_CONNECTION_URI=
      - REDIS_ENABLED=false
      # Webhook aponta para o n8n pela rede interna — sem host.docker.internal
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/hitl-resposta-bastos
      - WEBHOOK_GLOBAL_ENABLED=true
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#175197
      - LOG_LEVEL=ERROR
      - LOG_COLOR=true
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - bastos_net
    depends_on:
      n8n:
        condition: service_healthy   # aguarda n8n pronto antes de registrar webhooks
    restart: unless-stopped

# ==============================================================================
# Rede privada isolada
# ─────────────────────────────────────────────────────────────────────────────
# Todos os serviços compartilham bastos_net e se enxergam por nome:
#   API chama n8n  →  http://n8n:5678/webhook/hitl-bastos
#   n8n chama API  →  http://api:8000/hitl/callback
#   Evolution → n8n  →  http://n8n:5678/webhook/hitl-resposta-bastos
#
# Nenhum tráfego inter-serviço sai do host. Superfície de ataque mínima.
# ==============================================================================
networks:
  bastos_net:
    driver: bridge

# ==============================================================================
# Volumes nomeados — gerenciados pelo Docker
# ─────────────────────────────────────────────────────────────────────────────
# Sobrevivem a: rebuild, restart, remoção do container, atualização de imagem.
# Só são removidos com: docker volume rm <nome>  ou  docker compose down -v
#
# Para inspecionar:   docker volume ls | grep bastos
# Para fazer backup:  docker run --rm -v bastos_chroma:/data -v $(pwd):/out \
#                       alpine tar czf /out/chroma_backup.tar.gz /data
# ==============================================================================
volumes:
  bastos_chroma:   # Base vetorial ChromaDB (doutrinas, extratos indexados)
  bastos_db:       # SQLite: auth.db, liderancas.db, dashboard.db, grupos.db
  bastos_logs:     # Logs de auditoria cifrados com Fernet (LGPD Art.37)
  # n8n_data removido — usando bind mount em C:\Users\Administrador\.n8n
  evolution_data:  # Sessão WhatsApp autenticada (evita novo QR a cada restart)
